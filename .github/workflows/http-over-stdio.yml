name: HTTP over stdio portability

on:
  pull_request:
    paths:
      - 'mcp-core/**'
      - 'mcp-transport-http-over-stdio/**'
      - 'conformance-tests/server-http-over-stdio/**'
      - '.github/workflows/http-over-stdio.yml'
  workflow_dispatch: {}

jobs:
  transport:
    name: Transport on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows checkouts would otherwise convert line endings and fail the formatter.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install SDK modules the transport depends on
        run: mvn -B -ntp -pl mcp-core,mcp-json-jackson3,mcp-test -am install -DskipTests

      # Covers the process-pipe wire (real child JVMs over stdin/stdout) and the in-memory wire.
      - name: Transport contract
        run: mvn -B -ntp -pl mcp-transport-http-over-stdio verify
