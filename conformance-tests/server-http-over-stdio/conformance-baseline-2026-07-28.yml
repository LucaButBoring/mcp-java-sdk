  # server/discover, request _meta validation, and 2026 method inventory not implemented in SDK core
  - dns-rebinding-protection:localhost-host-valid-accepted
  - server-stateless:sep-2575-discover-capabilities-match-handlers
  - server-stateless:sep-2575-http-server-meta-invalid-400
  - server-stateless:sep-2575-http-server-method-not-found-404-initialize
  - server-stateless:sep-2575-http-server-method-not-found-404-ping
  - server-stateless:sep-2575-http-server-no-independent-requests-on-stream
  - server-stateless:sep-2575-missing-capability-http-400
